twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 10
      joystick:
        topic: /cmd_vel_joy
        timeout: 0.5
        priority: 100
      estop:
        # ultrasonic_estop only publishes while an obstacle is within
        # min_safe_distance; a short timeout means twist_mux falls back to
        # navigation/joystick within ~0.3s of the obstacle clearing.
        topic: /cmd_vel_estop
        timeout: 0.3
        priority: 200
